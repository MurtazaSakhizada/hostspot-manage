<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4338ca" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- WiFi arcs (large) -->
  <path d="M 30 105 Q 100 40 170 105" fill="none" stroke="url(#wifiGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M 48 118 Q 100 65 152 118" fill="none" stroke="url(#wifiGrad)" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M 66 131 Q 100 90 134 131" fill="none" stroke="url(#wifiGrad)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="100" cy="148" r="8" fill="white" filter="url(#glow)"/>

  <!-- Coin/Money symbol (bottom right) -->
  <circle cx="152" cy="148" r="24" fill="url(#coinGrad)" filter="url(#shadow)"/>
  <circle cx="152" cy="148" r="20" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="152" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#78350f">؋</text>

</svg>
